provider_categories:
  - identity-access-control
steps:
  - name: assume role
    type: script
    file: $SERVICE_PATH/scripts/aws/assume_role_step
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment

  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/aws/build_context
    output:
      - name: TFSTATE_BUCKET
        type: environment
      - name: REGION
        type: environment
      - name: TFSTATE_KEY_PREFIX
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: SERVER_HOSTNAME
        type: environment
      - name: SERVER_PORT
        type: environment
      - name: SERVER_MASTER_SECRET_ARN
        type: environment
      - name: DB_NAME
        type: environment
      - name: DB_USERNAME
        type: environment
      - name: MIGRATOR_SECRET_ARN
        type: environment

  - name: fetch migrations
    type: script
    file: $SERVICE_PATH/scripts/aws/fetch_migrations

  - name: prepare migrations
    type: script
    file: $SERVICE_PATH/scripts/aws/prepare_migrations

  - name: run migrations
    type: script
    file: $SERVICE_PATH/scripts/aws/run_migrations

  - name: write migration results
    type: script
    file: $SERVICE_PATH/scripts/aws/write_migration_results
