provider_categories:
  - identity-access-control
steps:
  - name: assume role
    type: script
    file: $SERVICE_PATH/scripts/aws/assume_role_step
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment

  - name: build context
    type: script
    file: $SERVICE_PATH/scripts/aws/build_context
    output:
      - name: TFSTATE_BUCKET
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: SERVER_HOSTNAME
        type: environment
      - name: SERVER_PORT
        type: environment
      - name: SERVER_MASTER_SECRET_ARN
        type: environment
      - name: DB_NAME
        type: environment
      - name: DB_USERNAME
        type: environment

  - name: build db setup context
    type: script
    file: $SERVICE_PATH/scripts/aws/build_db_setup_context
    output:
      - name: OUTPUT_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: DB_HOST
        type: environment
      - name: DB_PORT
        type: environment
      - name: MASTER_SECRET_ARN
        type: environment
      - name: DB_NAME
        type: environment
      - name: DB_USERNAME
        type: environment
      - name: SETUP_SKIPPED
        type: environment

  - name: remove database user
    type: script
    file: $SERVICE_PATH/scripts/aws/drop_database_user

  - name: tofu
    type: script
    file: $SERVICE_PATH/scripts/aws/do_tofu
    configuration:
      TOFU_ACTION: destroy

  - name: cleanup tfstate bucket
    type: script
    file: $SERVICE_PATH/scripts/aws/delete_tfstate_bucket
